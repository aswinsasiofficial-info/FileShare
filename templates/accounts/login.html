{% extends 'base.html' %}
{% block title %}Login - Fileshare{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card p-4 shadow-sm text-center">
            <h2 class="fw-bold mb-1" style="color: var(--primary-color);">Welcome Back!</h2>
            <p class="text-muted small mb-4">Login to your account</p>
            
            <form method="post" class="text-start">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold">
                            {% if field.name == 'username' %}Email{% else %}{{ field.label }}{% endif %}
                        </label>
                        <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" class="form-control" placeholder="Enter {% if field.name == 'username' %}email{% else %}{{ field.label|lower }}{% endif %}" required>
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">Login Now</button>
                </div>
            </form>
            <div class="text-center mt-3">
                <small>Don't have an account? <a href="{% url 'accounts:register' %}">Register here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
