{% extends 'base.html' %}
{% block title %}Register - Fileshare{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card p-4 shadow-sm">
            <h3 class="text-center mb-4 fw-bold" style="color: var(--primary-color);">Create Account</h3>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field.errors }}
                        <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" class="form-control" required>
                        {% if field.help_text %}
                            <small class="form-text text-muted">{{ field.help_text }}</small>
                        {% endif %}
                    </div>
                {% endfor %}
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">Register</button>
                </div>
            </form>
            <div class="text-center mt-3">
                <small>Already have an account? <a href="{% url 'accounts:login' %}">Login here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
