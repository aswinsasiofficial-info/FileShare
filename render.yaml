services:
  - type: web
    name: fileshare
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn file_share_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DJANGO_SETTINGS_MODULE
        value: file_share_project.settings
      - key: DEBUG
        value: "False"
    disk:
      name: media
      mountPath: /opt/render/project/src/media
      sizeGB: 1
